name: Monthly fact verify

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kill switch
        id: kill
        run: node scripts/kill-switch.mjs

      - name: Re-check privacy, prices, and free tiers
        id: verify
        if: steps.kill.outputs.publish == 'true'
        continue-on-error: true
        run: node scripts/verify-facts.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Publish verification
        if: steps.kill.outputs.publish == 'true' && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure')
        run: |
          if git diff --quiet -- lib/models.json lib/providers.json lib/held.json; then
            echo "Facts unchanged."
          else
            git config user.name "whichai-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/models.json lib/providers.json lib/held.json
            git commit -m "Re-check privacy, prices, and free tiers."
            git push
          fi

      - name: Fail if a fact was held
        if: steps.verify.outcome == 'failure'
        run: exit 1

      - name: Tell the owner
        if: failure()
        run: node scripts/notify-owner.mjs "The monthly fact check held a price or privacy line back."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
