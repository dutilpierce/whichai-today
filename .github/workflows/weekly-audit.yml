name: Weekly fact-check

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # fact-check.mjs imports the releases checker, which loads the Anthropic SDK.
      - name: Install packages
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Kill switch
        id: kill
        run: node scripts/kill-switch.mjs

      # A failed audit holds the bad lines and tells the owner, but the run still succeeds: it did
      # its job, and the hourly watchdog would otherwise re-run it (and re-alert) every hour.
      - name: Audit live data
        id: audit
        if: steps.kill.outputs.publish == 'true'
        continue-on-error: true
        run: node scripts/fact-check.mjs --links --hold

      - name: Publish holds
        # !cancelled(): without a status function this step was skipped whenever the audit failed.
        if: ${{ !cancelled() && steps.kill.outputs.publish == 'true' && (steps.audit.outcome == 'success' || steps.audit.outcome == 'failure') }}
        run: |
          if git diff --quiet -- lib/held.json; then
            echo "Holds unchanged."
          else
            bash scripts/publish.sh "Update fact-check holds." lib/held.json
          fi

      - name: Tell the owner
        if: ${{ !cancelled() && (failure() || steps.audit.outcome == 'failure') }}
        run: node scripts/notify-owner.mjs "The weekly fact-check held something back."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
