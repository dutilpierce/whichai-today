name: Monthly fact verify

on:
  schedule:
    # The 2nd, so it never queues behind the monthly apps refresh.
    - cron: "0 12 2 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-rankings
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The research scripts call Claude through the Anthropic SDK (Gemini is the fallback).
      - name: Install packages
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Kill switch
        id: kill
        run: node scripts/kill-switch.mjs

      - name: Re-check privacy, prices, and free tiers
        id: verify
        if: steps.kill.outputs.publish == 'true'
        continue-on-error: true
        run: node scripts/verify-facts.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Publish verification
        if: steps.kill.outputs.publish == 'true' && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure')
        run: |
          if git diff --quiet -- lib/models.json lib/providers.json lib/held.json; then
            echo "Facts unchanged."
          else
            bash scripts/publish.sh "Re-check privacy, prices, and free tiers." lib/models.json lib/providers.json lib/held.json
          fi

      - name: Fail if a fact was held
        if: steps.verify.outcome == 'failure'
        run: exit 1

      - name: Tell the owner
        if: failure()
        run: node scripts/notify-owner.mjs "The monthly fact check held a price or privacy line back."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
