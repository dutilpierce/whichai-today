name: Refresh model rankings

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-rankings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Research current leaders
        run: node scripts/refresh-rankings.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Publish if anything changed
        run: |
          if git diff --quiet -- lib/models.json; then
            echo "Rankings unchanged."
            exit 0
          fi
          git config user.name "whichai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/models.json
          git commit -m "Refresh model rankings for $(date -u +%Y-%m-%d)."
          git push
